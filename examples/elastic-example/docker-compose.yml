services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    # deploy:
    #   resources:
    # Максимально доступные ресурсы (жесткий лимит)
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    # Гарантированные ресурсы (сколько зарезервировать при старте)
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=es-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  setup:
    image: curlimages/curl:latest
    container_name: es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - ./setup.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    networks:
      - elastic
    restart: on-failure

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: kibana
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"
    networks:
      - elastic

volumes:
  es_data:

networks:
  elastic:
    driver: bridge